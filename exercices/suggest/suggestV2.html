<head>
<script src="js/utils.js"></script>
<script src="js/ajax.js"></script>
<script>
function choisir(contexte) {
	val("saisie",html(contexte.target));
	hide("suggestions");
}

function integrer(repDuServeur) {
	html("suggestions",repDuServeur);
	show("suggestions");
	hide("imgLoad");
}

function saisir() {
	ajax({
		//type:
		url: "fixture.php",
		//data:
		callback:integrer
	});
	show("imgLoad");
}

function annuler(contexte) {
	if(contexte.code == "Escape") {
		val("saisie","");
		hide("imgLoad");
		hide("suggestions");
		// NOTE : il faudrait aussi annuler les requetes ajax en cours... 
	}
	
}
</script>
<style>
#conteneur {
	position:relative;
	display:inline;
}
#saisie {
	width:250px;
	height:30px;
	padding-right:20px;
	outline:none;
	border:1px solid black;
}
#imgLoad{
	position:absolute;
	right:7px;
	top:2px;
	display:none;
}
#suggestions{
	position:absolute;
	border:1px solid black;
	border-top:0;
	padding:0;margin:0;
	left:0;width:248px;top:25px;
	display:none;
}
#suggestions li {
	display:block;
	padding:3px;
}

#suggestions li:hover {
	background-color:lightgrey;
	cursor:pointer;
}
</style>
</head>
