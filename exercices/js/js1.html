// On veut un compteur persistant entre deux appels de fonction
// ET de portée NON GLOBALE 
// ==> Closure / Fermeture / Enfermement 
// Cf. exemeple 

// On crée une variable locale i_foo à l'occasion de l'exécution d'une fonction foo 
// A l'intérieur de la fonction foo, on crée un autre fonction bar que l'on va renvoyer comme valeur de retour de la fonction foo 
// Le scope de la fonction bar contient i_foo 
// scope : tout ce que 'voit' la fonction 
// var. globales 
// ses propres var. locales
// toutes les variables qui existaient au moment de sa création : notamment i_foo 

// i_foo n'est pas globale 
// i_foo existera tant qu'il existe une référence à la fonction bar qui a 'enfermé' une référence vers i_foo dans son scope 

function foo() {
	var i_foo = 3; 
	var  bar = function() {
		trace("ifoo: " + i_foo++); 
	}
	return bar; 
}

var baar = foo();
