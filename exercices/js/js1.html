<script>

function trace(s) {
	// que fait cette fonction ?
	window.console && window.console.log(s);
	// identique à 
	//if (window.console) 
	//	window.console.log(s);
}

var MAX = 5; 
var compteur = 0; 
function debug(s) {
	if (s == undefined) return compteur; 
	if (compteur++ < MAX) trace(s);
}

// approche TDD : Test Driven Development
debug("msg1"); 
debug("msg2"); 
debug("msg3"); 
debug("msg4"); 
debug("msg5"); // ok 

debug("msg6"); // ne doit rien afficher 

trace(debug()); // valeur du compteur    
// raz du compteur ?? 
compteur = 0; // var globale DANGER !!!!
trace(debug()); // valeur du compteur 

debug("msg7"); // ok 

// On veut un compteur persistant entre deux appels de fonction
// ET de portée NON GLOBALE 
// ==> Closure / Fermeture / Enfermement 
// Cf. exemeple 

// On crée une variable locale i_foo à l'occasion de l'exécution d'une fonction foo 
// A l'intérieur de la fonction foo, on crée un autre fonction bar que l'on va renvoyer comme valeur de retour de la fonction foo 
// Le scope de la fonction bar contient i_foo 
// scope : tout ce que 'voit' la fonction 
// var. globales 
// ses propres var. locales
// toutes les variables qui existaient au moment de sa création : notamment i_foo 

// i_foo n'est pas globale 
// i_foo existera tant qu'il existe une référence à la fonction bar qui a 'enfermé' une référence vers i_foo dans son scope 

function foo() {
	var i_foo = 3; 
	var  bar = function() {
		trace("ifoo: " + i_foo++); 
	}
	return bar; 
}

var baar = foo(); 

// TODO : fabriquer un objet dbg 
// comportant des méthodes de débogage :

/*

function mkVarLocale(borne_max) {
	// borne_max est un paramètre formel 
	// les paramètres formels sont des variables locales 
	
	if (borne_max == undefined) borne_max=5;
	var compteur_interne = 0; 
	
	return {
		trace : function (s) {
			if (compteur_interne++ < borne_max) 
				trace(s);
		}, 
		reset : function () {
			compteur_interne = 0; 
		},
		getCompteur : function(){ 
			return compteur_interne; 
		}, 
		setCompteur : function(v){
			compteur_interne = v;
		} 
	}; 
}

trace("debut dbg");
//dbg = mkVarLocale(); 


dbg = (function (borne_max) {

	if (borne_max == undefined) borne_max=5;
	var compteur_interne = 0; 
	
	return {
		trace : function (s) {
			if (compteur_interne++ < borne_max) 
				trace(s);
		}, 
		reset : function () {
			compteur_interne = 0; 
		},
		getCompteur : function(){ 
			return compteur_interne; 
		}, 
		setCompteur : function(v){
			compteur_interne = v;
		} 
	}; 
}) (3);

dbg.trace("msg1"); // affiche msg1
dbg.trace("msg2");
dbg.trace("msg3");
dbg.trace("msg4");
dbg.trace("msg5"); // ok 
dbg.trace("msg6"); //nok
trace(dbg.getCompteur()); // affiche compteur
dbg.reset(); // raz compteur 
trace(dbg.getCompteur()); // affiche compteur 
dbg.trace("msg7"); // ok 
dbg.setCompteur(3); // affecte compteur
trace(dbg.getCompteur()); // affiche compteur

function show(refOrId,display) {
	// affiche l'élément dont la référence ou l'id est fourni
	// le paramètre display doit valoir block par défaut
	
	if (typeof refOrId == "string") 
		refOrId = document.getElementById(refOrId);
		
	// if (display==undefined) display = "block";
	
	refOrId.style.display = (display==undefined) ? "block" : display ; 
}

function hide(refOrId) {
	// cache l'élément dont la référence ou l'id est fourni
	// display none 
	// PAS visibility hidden
	
	if (typeof refOrId == "string") 
		refOrId = document.getElementById(refOrId);
		
	refOrId.style.display = "none";
}

function html(refOrId, val) {
	// affecte une valeur à l'élément dont la référence ou l'id est fourni; si val n'est pas fourni, on renvoie son contenu
	// innerHTML 
	
	if (typeof refOrId == "string") 
		refOrId = document.getElementById(refOrId);
		
	if (val == undefined) return refOrId.innerHTML; 
	else refOrId.innerHTML = val;
}

function val(refOrId, val) {
	// affecte une valeur à l'élément dont la référence ou l'id est fourni; si val n'est pas fourni, on renvoie son contenu
	// l'élément est un champ de formulaire
	// la fonction doit pouvoir manipuler l'état des champs de type checkbox et radio 
	// .value si champ classique 
	// si type vaut checkbox ou radio : .checked  
	
	if (typeof refOrId == "string") 
		refOrId = document.getElementById(refOrId);
	
	if ((refOrId.type =="radio") || (refOrId.type =="checkbox")) {
		// champ à cocher 
		if (val == undefined) return refOrId.checked; 
		else refOrId.checked = val;
	} else {
		// champ à remplir 
		if (val == undefined) return refOrId.value; 
		else refOrId.value = val;
	}
}
</script>


<body>

<div id="lediv"> lediv </div>
<input type="text" id="i1" value="i1"/>
<input type="checkbox" id="i2" />
<input type="radio" id="i3" /> 

</body>
